id: WS-SYS-015
title: IFEO Debugger Persistence
description: Detects persistence established via Image File Execution Options (IFEO) Debugger registry key hijacking.
author: WinSentinel Team
severity: high
status: active
logsource:
  product: windows
  service: sysmon
  event_id:
    - 12
    - 14
detection:
  selection:
    registry_target_object|contains: '\Image File Execution Options\'
    registry_target_object|endswith: '\Debugger'
  condition: selection
mitre_attack:
  - T1546.012
references:
  - https://attack.mitre.org/techniques/T1546/012/
falsepositives:
  - Software developers configuring debugging tools for specific executables
investigation_steps:
  - Identify the target executable being intercepted under IFEO.
  - Inspect registry_details to identify the debugger replacement program.
  - Investigate the process that wrote the IFEO registry key.
